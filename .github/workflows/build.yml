# Builds the Windows installer (NSIS .exe) on GitHub's machines. Run it by hand
# (Actions > Build > Run workflow): the installer is the run's artifact. On a version tag
# (v0.1.0...) it is also attached to a draft release of that tag (publish it by hand).
# Locally: run.bat 2. The installer is not signed: SmartScreen warns on the first start.
name: Build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@1.99.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: package.json
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      # libmpv-2.dll (the pinned build of scripts/fetch-libmpv.ps1).
      - uses: actions/cache@v4
        with:
          path: vendor/mpv
          key: libmpv-${{ hashFiles('scripts/fetch-libmpv.ps1') }}
      - name: libmpv
        run: ./scripts/fetch-libmpv.ps1

      - name: Build
        run: |
          pnpm install --frozen-lockfile
          pnpm tauri build --bundles nsis

      - uses: actions/upload-artifact@v7
        with:
          name: videk-windows
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          fail_on_unmatched_files: true
          files: src-tauri/target/release/bundle/nsis/*.exe
